name: Bug report
description: Report a correctness or behavior problem in @nestarc/idempotency
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Include exact installed versions and the request/retry sequence so we
        can reproduce the behavior. The supported matrix is Node.js 22/24,
        NestJS 10/11, and Express/Fastify. Reports from other environments are
        welcome; identify those versions in the environment field below.
        Use synthetic examples and remove credentials, connection strings,
        real idempotency keys, identities and sensitive request/response data.

  - type: input
    id: version
    attributes:
      label: Package version
      description: What version of `@nestarc/idempotency` are you using?
      placeholder: 1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and exact versions
      description: |
        Include Node.js, npm, NestJS core/common, HTTP adapter and its version.
        For Redis/Postgres, include driver and server versions. Include OS and
        deployment details such as process/replica count if relevant.
      placeholder: |
        Node.js:
        npm:
        @nestjs/common / @nestjs/core:
        @nestjs/platform-express or @nestjs/platform-fastify:
        express or fastify:
        ioredis / pg (if used):
        Redis / PostgreSQL server (if used):
        OS / deployment:
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage adapter
      options:
        - MemoryStorage
        - RedisStorage
        - PostgresStorage
        - Custom adapter
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
      placeholder: |
        I sent POST /payments twice with the same Idempotency-Key. I expected
        the second response to be a replay of the first, but got ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A minimal code snippet or link to a repo that reproduces the issue.
        Include a controller, module configuration (forRoot/forRootAsync),
        request/retry sequence, status codes and relevant response headers.
        For fingerprint or scope issues, use synthetic inputs that preserve
        the differences between requests. Note custom resolvers and TTLs.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Include relevant diagnostic codes, outcomes, warnings and errors.
        Redact secrets and sensitive data from application/driver logs too;
        do not include real keys, credentials or connection strings.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
