# Dependabot configuration for @nestarc/idempotency.
#
# Root npm dependencies and GitHub Actions are watched. The exact versions in
# scripts/release-matrix.mjs and test/consumers/* are maintained together manually:
# they define the supported Nest majors and representative/minimum peer profiles.
# Do not add the consumer fixtures as automatic update directories or raise the
# minimum profile without explicitly revising the compatibility contract.
#
# Schedule is weekly (Monday morning Seoul time) so PRs don't overwhelm
# the author. Minor/patch updates are grouped; major bumps open their
# own PRs unless they would change supported peer majors (see ignore below).

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # Keep existing lower bounds when the current range already permits an update.
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types: [minor, patch]
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/jest'
          - '@types/pg'
        update-types: [minor, patch]
      eslint-and-prettier:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
        update-types: [minor, patch]
      jest:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
        update-types: [minor, patch]
      postgres:
        patterns:
          - 'pg'
          - '@types/pg'
        update-types: [minor, patch]
    ignore:
      # Support changes require matching peer ranges and release-matrix coverage.
      # Keep Nest core, HTTP adapters, and testing on the same supported major.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pg'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/pg'
        update-types: ['version-update:semver-major']
      - dependency-name: 'rxjs'
        update-types: ['version-update:semver-major']
      - dependency-name: 'reflect-metadata'
        # 0.x minor releases can also leave the declared ^0.1 / ^0.2 ranges.
        versions: ['>=0.3.0']
      - dependency-name: 'ioredis'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
