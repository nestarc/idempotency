name: Release

# Manual dispatch only validates. Publishing is limited to a matching version
# tag and consumes the exact tarball validated by release-validation.yml.
# npm Trusted Publisher: nestarc/idempotency, release.yml, environment npm.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read package version
        id: read
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag matches package.json
        if: github.event_name == 'push'
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [ "$GIT_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::Tag $GIT_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

  validation:
    name: Shared release candidate validation
    needs: verify
    uses: ./.github/workflows/release-validation.yml

  publish:
    name: Publish the validated tarball
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, validation]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout candidate commit for verification and release notes
        uses: actions/checkout@v4

      - name: Setup Node with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Download the validated candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validation.outputs.artifact-name }}
          path: ${{ runner.temp }}/candidate

      - name: Verify commit, version, checksum, and all matrix evidence again
        env:
          PKG_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release-validation.mjs verify-artifact \
            --artifact "$RUNNER_TEMP/candidate/artifact.json" \
            --expected-commit "$GITHUB_SHA" \
            --expected-version "$PKG_VERSION"
          node scripts/release-validation.mjs verify-matrix \
            --artifact "$RUNNER_TEMP/candidate/artifact.json" \
            --expected-commit "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/candidate/evidence"

      # No install, build, pack, or package lifecycle scripts run in this job.
      - name: Publish the exact verified tarball
        run: |
          TARBALL=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { basename, join } from "node:path";
            const root = join(process.env.RUNNER_TEMP, "candidate");
            const { tarball } = JSON.parse(readFileSync(join(root, "artifact.json"), "utf8"));
            if (typeof tarball !== "string" || basename(tarball) !== tarball || !tarball.endsWith(".tgz")) {
              throw new Error("Invalid candidate tarball filename");
            }
            console.log(join(root, tarball));
          ')
          npm publish "$TARBALL" --ignore-scripts --provenance --access public

      - name: Extract CHANGELOG entry for this version
        id: changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 {flag=1; next}
              flag && /^## \[/ {flag=0}
              flag {print}
            ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          fi
          if [ ! -s "$RUNNER_TEMP/release-body.md" ]; then
            printf 'Release %s\n\nSee [CHANGELOG.md](./CHANGELOG.md) for details.\n' "$VERSION" > "$RUNNER_TEMP/release-body.md"
          fi
          echo "body-file=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.body-file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
