# Local development and release-validation storage services.
# Usage:
#   docker compose up -d --wait
#   export TEST_DATABASE_URL=postgresql://test:test@localhost:5432/idempotency_test
#   export TEST_REDIS_URL=redis://localhost:6379
#   npm run test:all -- --runInBand
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: idempotency_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d idempotency_test']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
